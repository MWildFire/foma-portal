<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Share of population living in cities and towns by region, 1950, 2025 and 2050 (projection)</title>
  <desc id="d1">Horizontal bar chart. For the world and six regions it shows the percentage of the population living in cities and towns under the UN Degree of Urbanization. 1950: World 60.0, Sub-Saharan Africa 42.7, Northern Africa and Western Asia 58.1, Central and Southern Asia 52.2, Eastern and South-Eastern Asia and Oceania 65.9, Latin America and the Caribbean 55.7, Europe, Northern America, Australia and New Zealand 63.9. 2025: 80.4, 70.3, 85.6, 85.6, 83.5, 79.2, 73.8. 2050 projection: 82.9, 77.5, 88.1, 88.1, 84.1, 81.4, 76.1.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <text x="12" y="20" font-size="15" font-weight="700" fill="#1f2933">Share of population living in cities and towns, by region</text>
  <text x="12" y="36" font-size="11" fill="#3e4c59">Degree of Urbanization (cities, towns and semi-dense areas), % of population. 2050 is a projection.</text>

  <rect x="230" y="44" width="14" height="9" fill="#b9c7d9"/>
  <text x="249" y="52" font-size="11" fill="#1f2933">1950</text>
  <rect x="300" y="44" width="14" height="9" fill="#1f4e79"/>
  <text x="319" y="52" font-size="11" fill="#1f2933">2025</text>
  <rect x="370" y="44" width="14" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="389" y="52" font-size="11" fill="#1f2933">2050 (projection)</text>

  <line x1="230" y1="78" x2="230" y2="332" stroke="#9aa5b1" stroke-width="1"/>
  <line x1="320" y1="78" x2="320" y2="332" stroke="#d9dee4" stroke-width="1"/>
  <line x1="410" y1="78" x2="410" y2="332" stroke="#d9dee4" stroke-width="1"/>
  <line x1="500" y1="78" x2="500" y2="332" stroke="#d9dee4" stroke-width="1"/>
  <line x1="590" y1="78" x2="590" y2="332" stroke="#9aa5b1" stroke-width="1"/>
  <text x="230" y="346" font-size="10" text-anchor="middle" fill="#3e4c59">0%</text>
  <text x="320" y="346" font-size="10" text-anchor="middle" fill="#3e4c59">25%</text>
  <text x="410" y="346" font-size="10" text-anchor="middle" fill="#3e4c59">50%</text>
  <text x="500" y="346" font-size="10" text-anchor="middle" fill="#3e4c59">75%</text>
  <text x="590" y="346" font-size="10" text-anchor="middle" fill="#3e4c59">100%</text>

  <text x="222" y="102" font-size="11" font-weight="700" text-anchor="end" fill="#1f2933">World</text>
  <rect x="230" y="84" width="216.00" height="9" fill="#b9c7d9"/>
  <rect x="230" y="94" width="289.44" height="9" fill="#1f4e79"/>
  <rect x="230" y="104" width="298.44" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="450.0" y="92" font-size="9.5" fill="#1f2933">60.0</text>
  <text x="523.4" y="102" font-size="9.5" fill="#1f2933">80.4</text>
  <text x="532.4" y="112" font-size="9.5" fill="#1f2933">82.9</text>

  <text x="222" y="138" font-size="11" text-anchor="end" fill="#1f2933">Sub-Saharan Africa</text>
  <rect x="230" y="120" width="153.72" height="9" fill="#b9c7d9"/>
  <rect x="230" y="130" width="253.08" height="9" fill="#1f4e79"/>
  <rect x="230" y="140" width="279.00" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="387.7" y="128" font-size="9.5" fill="#1f2933">42.7</text>
  <text x="487.1" y="138" font-size="9.5" fill="#1f2933">70.3</text>
  <text x="513.0" y="148" font-size="9.5" fill="#1f2933">77.5</text>

  <text x="222" y="174" font-size="11" text-anchor="end" fill="#1f2933">Northern Africa and Western Asia</text>
  <rect x="230" y="156" width="209.16" height="9" fill="#b9c7d9"/>
  <rect x="230" y="166" width="308.16" height="9" fill="#1f4e79"/>
  <rect x="230" y="176" width="317.16" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="443.2" y="164" font-size="9.5" fill="#1f2933">58.1</text>
  <text x="542.2" y="174" font-size="9.5" fill="#1f2933">85.6</text>
  <text x="551.2" y="184" font-size="9.5" fill="#1f2933">88.1</text>

  <text x="222" y="210" font-size="11" text-anchor="end" fill="#1f2933">Central and Southern Asia</text>
  <rect x="230" y="192" width="187.92" height="9" fill="#b9c7d9"/>
  <rect x="230" y="202" width="308.16" height="9" fill="#1f4e79"/>
  <rect x="230" y="212" width="317.16" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="421.9" y="200" font-size="9.5" fill="#1f2933">52.2</text>
  <text x="542.2" y="210" font-size="9.5" fill="#1f2933">85.6</text>
  <text x="551.2" y="220" font-size="9.5" fill="#1f2933">88.1</text>

  <text x="222" y="238" font-size="10.5" text-anchor="end" fill="#1f2933">Eastern and South-Eastern Asia</text>
  <text x="222" y="250" font-size="10.5" text-anchor="end" fill="#1f2933">and Oceania*</text>
  <rect x="230" y="228" width="237.24" height="9" fill="#b9c7d9"/>
  <rect x="230" y="238" width="300.60" height="9" fill="#1f4e79"/>
  <rect x="230" y="248" width="302.76" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="471.2" y="236" font-size="9.5" fill="#1f2933">65.9</text>
  <text x="534.6" y="246" font-size="9.5" fill="#1f2933">83.5</text>
  <text x="536.8" y="256" font-size="9.5" fill="#1f2933">84.1</text>

  <text x="222" y="282" font-size="11" text-anchor="end" fill="#1f2933">Latin America and the Caribbean</text>
  <rect x="230" y="264" width="200.52" height="9" fill="#b9c7d9"/>
  <rect x="230" y="274" width="285.12" height="9" fill="#1f4e79"/>
  <rect x="230" y="284" width="293.04" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="434.5" y="272" font-size="9.5" fill="#1f2933">55.7</text>
  <text x="519.1" y="282" font-size="9.5" fill="#1f2933">79.2</text>
  <text x="527.0" y="292" font-size="9.5" fill="#1f2933">81.4</text>

  <text x="222" y="310" font-size="10.5" text-anchor="end" fill="#1f2933">Europe, Northern America,</text>
  <text x="222" y="322" font-size="10.5" text-anchor="end" fill="#1f2933">Australia and New Zealand</text>
  <rect x="230" y="300" width="230.04" height="9" fill="#b9c7d9"/>
  <rect x="230" y="310" width="265.68" height="9" fill="#1f4e79"/>
  <rect x="230" y="320" width="273.96" height="9" fill="#d6e4f0" stroke="#1f4e79" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="464.0" y="308" font-size="9.5" fill="#1f2933">63.9</text>
  <text x="499.7" y="318" font-size="9.5" fill="#1f2933">73.8</text>
  <text x="508.0" y="328" font-size="9.5" fill="#1f2933">76.1</text>

  <text x="12" y="366" font-size="10" fill="#3e4c59">* Excluding Australia and New Zealand, which are grouped with Europe and Northern America.</text>
  <text x="12" y="382" font-size="10" fill="#3e4c59">Source: UN DESA Population Division (2025), World Urbanization Prospects 2025, File F02.</text>
</svg>
