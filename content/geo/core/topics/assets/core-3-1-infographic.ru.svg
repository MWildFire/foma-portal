  <rect x="524" y="311.2" width="60" height="18.8" fill="#2f5d8a"/>
  <text x="146" y="70.6" text-anchor="middle" font-size="12" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">4,873</text>
  <text x="214" y="92.4" text-anchor="middle" font-size="12" fill="#222">4,454</text>
  <text x="316" y="284.5" text-anchor="middle" font-size="12" fill="#222">759</text>
  <text x="384" y="249.2" text-anchor="middle" font-size="12" fill="#222">1,438</text>
  <text x="486" y="303.3" text-anchor="middle" font-size="12" fill="#222">398</text>
  <text x="554" y="305.2" text-anchor="middle" font-size="12" fill="#222">362</text>
