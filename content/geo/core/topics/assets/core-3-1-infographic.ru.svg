  <rect x="160" y="38" width="14" height="14" fill="#2f5d8a"/>
  <text x="180" y="50" font-size="12" fill="#222">2024</text>
  <line x1="90" y1="278" x2="610" y2="278" stroke="#e3e3e3" stroke-width="1"/>
  <line x1="90" y1="226" x2="610" y2="226" stroke="#e3e3e3" stroke-width="1"/>
  <line x1="90" y1="174" x2="610" y2="174" stroke="#e3e3e3" stroke-width="1"/>
