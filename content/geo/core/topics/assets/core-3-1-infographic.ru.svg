  <text x="82" y="230" text-anchor="end" font-size="11" fill="#555">2,000</text>
  <text x="82" y="178" text-anchor="end" font-size="11" fill="#555">3,000</text>
  <text x="82" y="126" text-anchor="end" font-size="11" fill="#555">4,000</text>
  <text x="82" y="74" text-anchor="end" font-size="11" fill="#555">5,000</text>
  <text transform="translate(22 200) rotate(-90)" text-anchor="middle" font-size="12" fill="#555">кг нефтяного эквивалента на человека</text>
  <rect x="116" y="76.6" width="60" height="253.4" fill="#9db7cf"/>
  <rect x="184" y="98.4" width="60" height="231.6" fill="#2f5d8a"/>
  <rect x="286" y="290.5" width="60" height="39.5" fill="#9db7cf"/>
