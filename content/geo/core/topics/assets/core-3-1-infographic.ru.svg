<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Bar chart: energy use per person by income group, 2000 and 2024">
  <title>Энергия на человека по группам дохода, 2000 и 2024</title>
  <desc>Потребление энергии на человека в группах высокого, среднего и низкого дохода, 2000 и 2024; кг нефтяного эквивалента. Источник: Всемирный банк.</desc>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Энергия на человека по группам дохода, 2000 и 2024</text>
