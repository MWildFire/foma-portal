<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Рост среднего уровня моря: скорость по периодам, 1901–2018</title>
  <desc id="d1">Скорость роста среднего глобального уровня моря, мм в год, по трём периодам; диапазоны IPCC и общий подъём за 1901–2018.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <text x="12" y="22" font-size="15" font-weight="700" fill="#1f2933">Рост среднего уровня моря: скорость по периодам, 1901–2018</text>
  <text x="12" y="40" font-size="11" fill="#3e4c59">Средняя скорость, мм в год. Под столбцами — диапазоны IPCC.</text>
  <text x="12" y="66" font-size="10" fill="#3e4c59">мм в год</text>

  <line x1="84" y1="130" x2="466" y2="130" stroke="#d9dee4" stroke-width="1"/>
  <line x1="84" y1="180" x2="466" y2="180" stroke="#d9dee4" stroke-width="1"/>
  <line x1="84" y1="230" x2="466" y2="230" stroke="#d9dee4" stroke-width="1"/>
  <line x1="84" y1="280" x2="466" y2="280" stroke="#d9dee4" stroke-width="1"/>
  <line x1="84" y1="70" x2="84" y2="330" stroke="#9aa5b1" stroke-width="1"/>
  <line x1="84" y1="330" x2="466" y2="330" stroke="#9aa5b1" stroke-width="1"/>
  <text x="74" y="334" font-size="10" text-anchor="end" fill="#3e4c59">0</text>
  <text x="74" y="284" font-size="10" text-anchor="end" fill="#3e4c59">1</text>
  <text x="74" y="234" font-size="10" text-anchor="end" fill="#3e4c59">2</text>
  <text x="74" y="184" font-size="10" text-anchor="end" fill="#3e4c59">3</text>
  <text x="74" y="134" font-size="10" text-anchor="end" fill="#3e4c59">4</text>

  <rect x="142" y="265" width="96" height="65" fill="#b9c7d9"/>
  <rect x="252" y="235" width="96" height="95" fill="#5b8db8"/>
  <rect x="362" y="145" width="96" height="185" fill="#1f4e79"/>

  <text x="190" y="258" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">1.3</text>
  <text x="300" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">1.9</text>
  <text x="410" y="138" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">3.7</text>

  <text x="190" y="348" font-size="11" text-anchor="middle" fill="#1f2933">1901–1971</text>
  <text x="300" y="348" font-size="11" text-anchor="middle" fill="#1f2933">1971–2006</text>
  <text x="410" y="348" font-size="11" text-anchor="middle" fill="#1f2933">2006–2018</text>
  <text x="190" y="364" font-size="9.5" text-anchor="middle" fill="#3e4c59">Диапазон IPCC: 0.6–2.1</text>
  <text x="300" y="364" font-size="9.5" text-anchor="middle" fill="#3e4c59">Диапазон IPCC: 0.8–2.9</text>
  <text x="410" y="364" font-size="9.5" text-anchor="middle" fill="#3e4c59">Диапазон IPCC: 3.2–4.2</text>

  <rect x="478" y="96" width="150" height="216" rx="4" fill="#f2f5f9" stroke="#9aa5b1" stroke-width="1"/>
  <text x="490" y="122" font-size="12" font-weight="700" fill="#1f2933">Общий подъём</text>
  <text x="490" y="139" font-size="11" fill="#3e4c59">1901–2018</text>
  <text x="490" y="180" font-size="26" font-weight="700" fill="#1f4e79">0.20 м</text>
  <text x="490" y="198" font-size="10" fill="#3e4c59">Диапазон IPCC: 0.15–0.25 м</text>
  <text x="490" y="236" font-size="10" fill="#1f2933">Среднее за 117 лет:</text>
  <text x="490" y="252" font-size="10" font-weight="700" fill="#1f2933">около 1.7 мм в год</text>
  <text x="490" y="276" font-size="10" fill="#1f2933">Скорость в 2006–2018:</text>
  <text x="490" y="290" font-size="10" fill="#1f2933">в 2.8 раза выше 1901–1971</text>

  <text x="12" y="390" font-size="10" fill="#3e4c59">Источник: IPCC (2021), AR6 WG1, резюме для политиков, A.1.7; наблюдения 1901–2018.</text>
</svg>
