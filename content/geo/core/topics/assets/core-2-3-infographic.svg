<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">Share of electricity generated from renewables in the world, China, Germany and the UAE, 2015 and 2025</title>
  <desc id="d1">Horizontal bar chart of the share of total electricity generation from renewables, in percent. World: 22.9 in 2015 and 33.5 in 2025. China: 23.8 and 36.5. Germany: 29.4 and 58.5. United Arab Emirates: 0.2 and 10.4. Renewables are hydro, wind, solar, bioenergy and other renewables. Source: Ember, Yearly Electricity Data (Global), file updated 6 October 2026.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <text x="12" y="22" font-size="15" font-weight="700" fill="#1f2933">Share of electricity generated from renewables, 2015 and 2025</text>
  <text x="12" y="38" font-size="11" fill="#3e4c59">Renewables = hydro, wind, solar, bioenergy and other renewables, as % of total electricity generation.</text>

  <rect x="12" y="50" width="14" height="9" fill="#b9c7d9"/>
  <text x="31" y="58" font-size="11" fill="#1f2933">2015</text>
  <rect x="80" y="50" width="14" height="9" fill="#1f4e79"/>
  <text x="99" y="58" font-size="11" fill="#1f2933">2025</text>

  <line x1="200" y1="72" x2="200" y2="326" stroke="#9aa5b1" stroke-width="1"/>
  <line x1="257" y1="72" x2="257" y2="326" stroke="#d9dee4" stroke-width="1"/>
  <line x1="314" y1="72" x2="314" y2="326" stroke="#d9dee4" stroke-width="1"/>
  <line x1="371" y1="72" x2="371" y2="326" stroke="#d9dee4" stroke-width="1"/>
  <line x1="428" y1="72" x2="428" y2="326" stroke="#d9dee4" stroke-width="1"/>
  <line x1="485" y1="72" x2="485" y2="326" stroke="#d9dee4" stroke-width="1"/>
  <line x1="542" y1="72" x2="542" y2="326" stroke="#d9dee4" stroke-width="1"/>
  <line x1="599" y1="72" x2="599" y2="326" stroke="#d9dee4" stroke-width="1"/>
  <line x1="200" y1="326" x2="599" y2="326" stroke="#9aa5b1" stroke-width="1"/>

  <text x="200" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">0%</text>
  <text x="257" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">10%</text>
  <text x="314" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">20%</text>
  <text x="371" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">30%</text>
  <text x="428" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">40%</text>
  <text x="485" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">50%</text>
  <text x="542" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">60%</text>
  <text x="599" y="340" font-size="10" text-anchor="middle" fill="#3e4c59">70%</text>
  <text x="400" y="358" font-size="11" text-anchor="middle" fill="#1f2933">Share of total electricity generation (%)</text>

  <text x="192" y="104" font-size="11" font-weight="700" text-anchor="end" fill="#1f2933">World</text>
  <rect x="200" y="84" width="130.5" height="16" fill="#b9c7d9"/>
  <text x="335.5" y="96" font-size="10" fill="#1f2933">22.9</text>
  <rect x="200" y="102" width="191.0" height="16" fill="#1f4e79"/>
  <text x="396.0" y="114" font-size="10" fill="#1f2933">33.5</text>

  <text x="192" y="162" font-size="11" font-weight="700" text-anchor="end" fill="#1f2933">China</text>
  <rect x="200" y="142" width="135.7" height="16" fill="#b9c7d9"/>
  <text x="340.7" y="154" font-size="10" fill="#1f2933">23.8</text>
  <rect x="200" y="160" width="208.1" height="16" fill="#1f4e79"/>
  <text x="413.1" y="172" font-size="10" fill="#1f2933">36.5</text>

  <text x="192" y="220" font-size="11" font-weight="700" text-anchor="end" fill="#1f2933">Germany</text>
  <rect x="200" y="200" width="167.6" height="16" fill="#b9c7d9"/>
  <text x="372.6" y="212" font-size="10" fill="#1f2933">29.4</text>
  <rect x="200" y="218" width="333.5" height="16" fill="#1f4e79"/>
  <text x="538.5" y="230" font-size="10" fill="#1f2933">58.5</text>

  <text x="192" y="278" font-size="11" font-weight="700" text-anchor="end" fill="#1f2933">UAE</text>
  <rect x="200" y="258" width="1.1" height="16" fill="#b9c7d9"/>
  <text x="206.1" y="270" font-size="10" fill="#1f2933">0.2</text>
  <rect x="200" y="276" width="59.3" height="16" fill="#1f4e79"/>
  <text x="264.3" y="288" font-size="10" fill="#1f2933">10.4</text>

  <text x="12" y="382" font-size="10" fill="#3e4c59">Source: Ember, Yearly Electricity Data (Global), file updated 6 October 2026; values for 2015 and 2025, one decimal place.</text>
</svg>
