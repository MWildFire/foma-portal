<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="core33-title core33-desc">
  <title id="core33-title">Recycling rate of municipal waste in Germany, the Netherlands and Romania, 2014, 2020 and 2023</title>
  <desc id="core33-desc">Grouped bar chart of the percentage of municipal waste that is recycled. Germany: 65.6 in 2014, 70.3 in 2020, 68.7 in 2023. Netherlands: 50.9, 57.0, 57.9. Romania: 13.1, 12.2, 12.4.</desc>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="20" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111">Recycling rate of municipal waste (%)</text>
  <text x="20" y="42" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444444">Share of municipal waste that is recycled, by country and year</text>
  <rect x="20" y="50" width="12" height="12" fill="#9ecae1"/>
  <text x="38" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222222">2014</text>
  <rect x="90" y="50" width="12" height="12" fill="#4292c6"/>
  <text x="108" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222222">2020</text>
  <rect x="160" y="50" width="12" height="12" fill="#08519c"/>
  <text x="178" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222222">2023</text>
  <g stroke="#dddddd" stroke-width="1">
    <line x1="70" y1="278" x2="610" y2="278"/>
    <line x1="70" y1="216" x2="610" y2="216"/>
    <line x1="70" y1="154" x2="610" y2="154"/>
    <line x1="70" y1="92" x2="610" y2="92"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444444" text-anchor="end">
    <text x="62" y="96">80%</text>
    <text x="62" y="158">60%</text>
    <text x="62" y="220">40%</text>
    <text x="62" y="282">20%</text>
    <text x="62" y="344">0%</text>
  </g>
  <line x1="70" y1="92" x2="70" y2="340" stroke="#333333" stroke-width="1"/>
  <line x1="70" y1="340" x2="610" y2="340" stroke="#333333" stroke-width="1"/>
  <rect x="112" y="136.6" width="40" height="203.4" fill="#9ecae1"/>
  <rect x="160" y="122.1" width="40" height="217.9" fill="#4292c6"/>
  <rect x="208" y="127.0" width="40" height="213.0" fill="#08519c"/>
  <rect x="282" y="182.2" width="40" height="157.8" fill="#9ecae1"/>
  <rect x="330" y="163.3" width="40" height="176.7" fill="#4292c6"/>
  <rect x="378" y="160.5" width="40" height="179.5" fill="#08519c"/>
  <rect x="452" y="299.4" width="40" height="40.6" fill="#9ecae1"/>
  <rect x="500" y="302.2" width="40" height="37.8" fill="#4292c6"/>
  <rect x="548" y="301.6" width="40" height="38.4" fill="#08519c"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222222" text-anchor="middle">
    <text x="132" y="130.6">65.6</text>
    <text x="180" y="116.1">70.3</text>
    <text x="228" y="121.0">68.7</text>
    <text x="302" y="176.2">50.9</text>
    <text x="350" y="157.3">57.0</text>
    <text x="398" y="154.5">57.9</text>
    <text x="472" y="293.4">13.1</text>
    <text x="520" y="296.2">12.2</text>
    <text x="568" y="295.6">12.4</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="180" y="362">Germany</text>
    <text x="350" y="362">Netherlands</text>
    <text x="520" y="362">Romania</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444444">
    <text x="20" y="384">Source: Eurostat, dataset cei_wm011, Recycling rate of municipal waste (updated 30 March 2026).</text>
  </g>
</svg>
